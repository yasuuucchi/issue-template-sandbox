name: "MCP / SaaS連携 利用申請"
description: |
  AIツールから外部サービス（MCP / SaaSコネクタ）への接続を申請するフォームです。
  AI Ops Squad で技術審査と必要に応じた法務確認を行います。
title: "[MCP申請] [接続先]"
labels:
  - "AI Ops"
  - "MCP申請"
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## MCP / SaaS 連携 利用申請

        AIツールから外部サービスに接続したいときの申請フォームです。

        - 埋めて issue を作ると、AI Ops Squad が受付・技術審査・必要に応じて法務相談まで進めます
        - 結果は本 issue にコメントで通知します

        💡 申請するか迷ったら、issue を作る前に **#ai_ops_squad** でお気軽に聞いてください。

  - type: textarea
    id: why
    attributes:
      label: "Why（何のために使いたいか）"
      description: |
        どの業務で何をしたいかを 2〜3 行で書いてください。
        具体的な業務シーンが分かるほど、審査が早く進みます。
      placeholder: |
        例:
        採用スカウト文面の参考に、自分の過去スカウト Google Drive フォルダから類似成功例を
        Cowork に拾わせて、新規候補者向け下書きを作りたい。
    validations:
      required: true

  - type: input
    id: target-service
    attributes:
      label: "接続したいサービス / MCP"
      description: "AIから繋ぎたい外部サービス名、またはMCPサーバー名を書いてください。"
      placeholder: "例: Slack MCP Server / Google Drive"
    validations:
      required: true

  - type: input
    id: official-link
    attributes:
      label: "公式リンク"
      description: "サービス公式サイト or MCPリポジトリのURLを貼ってください。"
      placeholder: "https://github.com/modelcontextprotocol/servers/..."
    validations:
      required: true

  - type: input
    id: target-service-legal-issue
    attributes:
      label: "接続先サービスの既存法務相談 issue（任意）"
      description: |
        接続先のサービス本体を社内で既に使っている場合、そのときの法務相談 issue があれば貼ってください。
        例: Figma の MCP を使いたい → 過去の Figma 社内利用申請時の issue
        AI Ops で「追加相談として進めるか / 新規起票か」を判定する素材になります。
        分からなければ空欄でOK。
      placeholder: "例: https://github.com/wantedly/corporate/issues/XXXXX"
    validations:
      required: false

  - type: checkboxes
    id: data-types
    attributes:
      label: "接続後にAIに入力される可能性がある情報（任意）"
      description: |
        該当するものをチェックしてください（複数可）。
      options:
        - label: "公開情報"
        - label: "当社の機密情報"
        - label: "個人情報"
        - label: "他社から委託された情報"

  - type: textarea
    id: additional-notes
    attributes:
      label: "補足（任意）"
      description: |
        利用したい期間、関係する社内 issue や Slackスレ、その他特記事項があれば書いてください。
        書くことがなければ空欄でOKです。
      placeholder: "あれば記載"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ### 📚 参考リンク

        - 生成AI活用ポリシー・ガイドライン: <リンク>
        - MCP/SaaS連携ガイドライン（§5.2 既掲載コネクタ一覧）: <リンク>
        - 入力情報スプシ: <リンク>
        - 困ったら **#ai_ops_squad** へ
